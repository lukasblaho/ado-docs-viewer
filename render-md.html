<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="theme-init.js"></script>
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --ink: #1B1B22; --ink2: #5B5B68; --ink3: #8A8A98;
      --line: #E8E5DE; --accent: #5B4BFF; --accent-soft: #EEECFF; --hover: #F6F4FF; --code: #EFECE5;
      --amber: #F0B429; --amber-soft: #FFF0B8; --amber-ink: #7A5200;
      --green: #188A5C; --green-soft: #E4F5EC; --sel: #CFC8FF;
      --grad: linear-gradient(135deg, #6A5CFF, #B05CFF);
      --glow: #5B4BFF66; --shadow: #1B1B220F; --quote-bg: #FFF8DD;
      --res-bg: #F3FAF6; --res-line: #CDE9DB; --res-quote: #E9F5EF;
      --danger: #D14B4B; --danger-line: #F1CFCF; --danger-bg: #FFEBE9; --danger-ink: #A40E26;
      --err-bg: #FDE4E4; --err-ink: #8A1F1F; --bar-bg: #17171C; --bar-hover: #2A2A33; --toggle-shadow: var(--toggle-shadow);
      color-scheme: light;
      --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    }

    :root[data-theme="dark"] {
      --bg: #0B0F14; --surface: #11161D; --ink: #D6DEEB; --ink2: #8E9BAE; --ink3: #6B778A;
      --line: #1E2631; --accent: #7AA2FF; --accent-soft: #15203A; --hover: #101826; --code: #151B24;
      --amber: #E3B341; --amber-soft: #3B2F0E; --amber-ink: #F0C75E;
      --green: #3FB950; --green-soft: #11261A; --sel: #22407A;
      --grad: linear-gradient(135deg, #2F6BFF, #7C4DFF);
      --glow: #2F6BFF77; --shadow: #00000066; --quote-bg: #2E2810;
      --res-bg: #0F2118; --res-line: #1F5236; --res-quote: #11261A;
      --danger: #F85149; --danger-line: #5A2A2E; --danger-bg: #2A1517; --danger-ink: #FF8E88;
      --err-bg: #3A1618; --err-ink: #FFB4AE; --bar-bg: #1C2432; --bar-hover: #26314A; --toggle-shadow: #00000080;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.7; color: var(--ink); background: var(--bg); }
    button { font-family: inherit; }
    svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* ---- top bar ---- */
    #toolbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; }
    #toolbar .left, #toolbar .right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #toolbar .left { flex: 1; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; font-size: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    #filepath { color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #filepath b { color: var(--ink); font-weight: 600; }
    #sourceLink { color: var(--ink3); text-decoration: none; font-size: 12px; white-space: nowrap; }
    #sourceLink:hover { color: var(--accent); }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .pill[hidden] { display: none; }
    .pill.open { background: var(--amber-soft); color: var(--amber-ink); }
    .pill.open i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    .pill.done { background: var(--green-soft); color: var(--green); }
    #viewToggle { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
    #viewToggle button { border: 0; background: none; padding: 4px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink2); cursor: pointer; }
    #viewToggle button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px var(--toggle-shadow); }

    #status { max-width: 860px; margin: 40px auto; padding: 16px 24px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13px; }
    #status.error { background: var(--err-bg); color: var(--err-ink); }

    /* ---- page layout: contents | document ---- */
    #page { display: flex; align-items: flex-start; }
    #toc { position: sticky; top: 60px; flex: 0 0 268px; width: 268px; max-height: calc(100vh - 60px); overflow-y: auto; padding: 44px 16px 24px 28px; display: flex; flex-direction: column; gap: 2px; }
    #toc .toc-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--ink3); margin-bottom: 8px; }
    #toc a { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 9px; font-size: 13.5px; line-height: 1.4; color: var(--ink2); text-decoration: none; }
    #toc a:hover { background: var(--hover); }
    #toc .toc-title { display: flex; align-items: center; justify-content: space-between; padding-right: 6px; }
    #toc .toc-ctl { display: inline-flex; gap: 2px; }
    #toc .toc-ctl button { width: 22px; height: 22px; border: 0; border-radius: 6px; background: none; color: var(--ink3); font-size: 15px; line-height: 1; cursor: pointer; }
    #toc .toc-ctl button:hover { background: var(--hover); color: var(--accent); }
    #toc a { padding-left: 4px; }
    #toc .chev { flex: none; width: 18px; height: 18px; padding: 0; margin-left: -4px; border: 0; background: none; color: var(--ink3); display: grid; place-items: center; border-radius: 5px; cursor: pointer; font-size: 13px; }
    #toc .chev:disabled { visibility: hidden; cursor: default; }
    #toc .chev:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
    #toc .chev .ic { transition: transform .12s; }
    #toc a.expanded .chev .ic { transform: rotate(90deg); }
    #toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    #toc a span.t { flex: 1; min-width: 0; }
    #toc .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--amber-soft); color: var(--amber-ink); font-size: 10.5px; font-weight: 700; line-height: 18px; text-align: center; }
    #content { flex: 1; min-width: 0; padding: 40px 0 72px; }
    #source { display: none; max-width: 860px; margin: 40px auto; padding: 20px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font: 13.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
    body.view-source #content { display: none !important; }
    body.view-source #source { display: block; }

    /* ---- markdown typography ---- */
    #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 { margin: 0; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
    #content h1 { font-size: 34px; }
    #content h2 { font-size: 30px; }
    #content h3 { font-size: 22px; }
    #content h4 { font-size: 18px; }
    #content h1, #content h2 { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    #content p { margin: 0; }
    #content a { color: var(--accent); }
    #content code { background: var(--code); border-radius: 5px; padding: 1px 6px; font-size: 13.5px; font-family: var(--mono); }
    #content pre { background: var(--code); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0; }
    #content pre code { background: none; padding: 0; font-size: 13px; }
    #content blockquote { margin: 0; padding: 0 1em; color: var(--ink2); border-left: 3px solid var(--sel); }
    #content table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
    #content th, #content td { border: 1px solid var(--line); padding: 6px 13px; }
    #content th { background: var(--surface); font-weight: 600; }
    #content img { max-width: 100%; }
    #content ul, #content ol { padding-left: 1.6em; margin: 0; }
    #content li { margin: .2em 0; }
    #content hr { border: none; border-top: 1px solid var(--line); margin: 0; }

    /* ---- blocks: gutter | body | rail ---- */
    .md-block { position: relative; display: grid; grid-template-columns: 44px minmax(0, 680px) 340px; column-gap: 28px; justify-content: center; margin-bottom: 10px; }
    .md-body { grid-column: 2; grid-row: 1; padding: 8px 12px; border-radius: 12px; min-width: 0; transition: background .12s; }
    .md-block:hover > .md-body { background: var(--hover); }
    .md-block.all-resolved > .md-body { border-radius: 4px 12px 12px 4px; box-shadow: inset 3px 0 0 var(--green); background: none; }
    .md-gutter { grid-column: 1; grid-row: 1; padding: 10px 6px 0 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .md-add-comment { width: 28px; height: 28px; border: none; border-radius: 9px; background: var(--grad); color: #fff; font-size: 15px; display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 4px 14px var(--glow); opacity: 0; transition: opacity .1s; }
    .md-block:hover .md-add-comment, .md-add-comment:focus-visible { opacity: 1; }
    .md-block.has-threads .md-add-comment { display: none; }
    .md-badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 28px; min-width: 28px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--amber); background: var(--amber-soft); color: var(--amber-ink); font-size: 12px; font-weight: 700; cursor: pointer; }
    .md-badge.resolved { border-color: transparent; background: var(--green-soft); color: var(--green); padding: 0; width: 28px; font-size: 15px; }
    .md-threads { grid-column: 3; grid-row: 1; align-self: start; height: 0; overflow: visible; position: relative; z-index: 20; padding-top: 4px; display: flex; flex-direction: column; gap: 10px; min-width: 0; font-size: 14px; line-height: 1.5; }
    .md-threads[hidden] { display: none; }
    ::highlight(md-anchored) { background: var(--amber-soft); text-decoration: underline 2px var(--amber); }
    ::highlight(md-resolved) { background: var(--green-soft); }

    .theme-sw { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
    .theme-sw button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; color: var(--ink3); font-size: 14px; display: inline-flex; cursor: pointer; }
    .theme-sw button.on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px var(--toggle-shadow); }

    /* ---- source line numbers ---- */
    .ln-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; border-radius: 999px; background: none; color: var(--ink2); font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .ln-toggle:hover { background: var(--hover); }
    .ln-toggle.on { background: var(--accent-soft); color: var(--accent); }
    .ln-toggle .ic { font-size: 13px; }
    .md-ln { display: none; grid-column: 1; grid-row: 1; padding: 14px 10px 0 0; text-align: right; font: 11.5px/1.7 var(--mono); color: var(--ink3); user-select: none; }
    .md-block.has-threads:not(.all-resolved) > .md-ln { color: var(--accent); font-weight: 700; }
    .md-block:has(> .md-body > h1, > .md-body > h2) > .md-ln { padding-top: 22px; }
    body.show-lines .md-ln { display: block; }
    body.show-lines .md-block { grid-template-columns: 36px 44px minmax(0, 680px) 340px; }
    body.show-lines .md-gutter { grid-column: 2; }
    body.show-lines .md-body { grid-column: 3; }
    body.show-lines .md-threads { grid-column: 4; }

    /* ---- selection toolbar ---- */
    .md-sel-bar { position: fixed; z-index: 150; display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--bar-bg); box-shadow: 0 10px 28px #00000066; }
    .md-sel-bar button { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 9px; padding: 7px 12px; background: none; color: #D9D9E3; font-size: 13px; font-weight: 500; cursor: pointer; }
    .md-sel-bar button:hover { background: var(--bar-hover); }
    .md-sel-bar button.primary { background: var(--grad); color: #fff; font-weight: 600; padding: 7px 13px; }

    /* ---- thread cards ---- */
    .md-thread, .md-composer.new { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 24px var(--shadow); transition: opacity .2s, transform .2s; }
    .md-thread.resolved { background: var(--res-bg); border-color: var(--res-line); box-shadow: none; padding: 12px 14px; }
    .md-thread.removing { opacity: 0; transform: translateX(12px); }
    .md-thread-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--amber-ink); }
    .md-thread-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .md-thread.resolved .md-thread-head { color: var(--green); font-size: 12.5px; }
    .md-thread.resolved .md-thread-head .ic { font-size: 16px; }
    .md-thread-head .grow { flex: 1; }
    .md-line-chip { padding: 3px 8px; border-radius: 6px; background: var(--code); color: var(--ink2); font: 11.5px var(--mono); }
    .md-actions { display: inline-flex; gap: 8px; align-items: center; }
    .md-quote { display: flex; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--quote-bg); color: var(--ink2); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; position: relative; padding-left: 21px; }
    .md-quote::before { content: ''; position: absolute; left: 10px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--amber); }
    .md-composer.new .md-quote, .md-composer .md-quote.new { background: var(--accent-soft); }
    .md-composer.new .md-quote::before { background: var(--accent); }
    .md-thread.resolved .md-quote { background: var(--res-quote); }
    .md-thread.resolved .md-quote::before { background: var(--green); }
    .md-comment { display: flex; flex-direction: column; gap: 6px; }
    .md-comment-head { display: flex; align-items: center; gap: 8px; }
    .md-avatar { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; flex: none; }
    .md-author { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .md-when { font-size: 12px; color: var(--ink3); }
    .md-comment-body { padding-left: 34px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .md-btn { font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
    .md-btn.small { font-size: 12px; padding: 4px 10px; border-radius: 8px; }
    .md-btn.ghost { color: var(--ink2); }
    .md-btn.resolve .ic { color: var(--green); }
    .md-btn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 4px 12px var(--glow); }
    .md-btn:disabled { opacity: .5; cursor: default; }
    .md-icon-btn { width: 28px; height: 28px; padding: 0; justify-content: center; border-radius: 8px; border-color: var(--danger-line); color: var(--danger); }
    .md-icon-btn:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    .md-reply-row { display: flex; gap: 8px; }
    .md-reply-input { flex: 1; text-align: left; border: 0; background: var(--bg); color: var(--ink3); font-size: 13px; font-weight: 400; border-radius: 10px; padding: 8px 12px; cursor: text; }
    .md-del-wrap { display: inline-flex; }
    .md-del-confirm { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border: 1px solid var(--danger-line); border-radius: 14px; background: var(--danger-bg); color: var(--danger-ink); font-size: 12px; font-weight: 500; animation: md-pop .18s ease-out; }
    .md-del-confirm[hidden], .md-icon-btn[hidden] { display: none; }
    .md-yes { background: var(--danger); border-color: var(--danger); color: #fff; border-radius: 12px; }
    .md-no { border-radius: 12px; }
    @keyframes md-pop { from { opacity: 0; transform: translateX(8px) scale(.95); } to { opacity: 1; transform: none; } }

    .md-composer { display: flex; flex-direction: column; gap: 12px; }
    .md-composer.new { border: 1.5px solid var(--accent); box-shadow: 0 10px 32px var(--glow); }
    .md-composer textarea { width: 100%; font: inherit; font-size: 14px; line-height: 1.5; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; resize: vertical; color: var(--ink); min-height: 92px; }
    .md-composer textarea:focus { outline: 2px solid var(--sel); border-color: var(--accent); }
    .md-composer-row { display: flex; align-items: center; gap: 8px; }
    .md-composer-row .hint { flex: 1; font-size: 12px; color: var(--ink3); }
    .md-toast { position: fixed; bottom: 16px; right: 16px; max-width: 420px; background: var(--err-bg); color: var(--err-ink); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px #0003; z-index: 200; }

    /* ---- compact: no contents, threads under the paragraph ---- */
    @media (max-width: 1320px) {
      #toc { display: none; }
      .md-block { display: block; max-width: 860px; margin: 0 auto 10px; padding: 0 24px 0 56px; }
      .md-gutter { position: absolute; left: 6px; top: 0; width: 44px; }
      .md-threads { position: absolute; top: 100%; left: 56px; right: 24px; height: auto; margin: 6px 0 0; }
      .md-block:has(.md-thread:hover, .md-composer:focus-within) { z-index: 21; }
      .chip + #filepath { display: none; }
      .md-ln { position: absolute; left: 6px; top: 0; width: 36px; }
      body.show-lines .md-block { display: block; padding-left: 100px; }
      body.show-lines .md-gutter { left: 50px; }
      body.show-lines .md-threads { left: 100px; }
    }
    .mermaid-diagram { margin: 1em 0; overflow-x: auto; }
    .mermaid-diagram svg { max-width: 100%; height: auto; display: block; }
    .plantuml-diagram { margin: 1em 0; overflow-x: auto; }
    .plantuml-diagram img { max-width: 100%; display: block; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="left">
      <div class="logo" id="logo"></div>
      <span class="chip" id="chip" hidden></span>
      <span id="filepath">Loading…</span>
    </div>
    <div class="right">
      <button id="lineToggle" class="ln-toggle" title="Show source line numbers"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg><span>Line numbers</span></button>
      <span class="pill open" id="openCount" hidden><i></i><span></span></span>
      <span class="pill done" id="doneCount" hidden><span></span></span>
      <div id="viewToggle"><button class="on" data-view="rendered">Rendered</button><button data-view="source">Source</button></div>
      <div id="themeToggle" class="theme-sw" role="group" aria-label="Theme"><button data-theme="light" title="Light theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"/></svg></button><button data-theme="dark" title="Dark theme"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button></div>
      <a id="sourceLink" href="#" target="_blank">View source ↗</a>
    </div>
  </div>
  <div id="status">Fetching file…</div>
  <div id="page">
    <nav id="toc" style="display:none"></nav>
    <div id="content" style="display:none"></div>
  </div>
  <pre id="source"></pre>

  <script src="lib/marked.min.js"></script>
  <script src="lib/pako.min.js"></script>
  <script src="lib/mermaid.min.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="azure-comments.js"></script>
  <script src="render-md.js"></script>
</body>
</html>
