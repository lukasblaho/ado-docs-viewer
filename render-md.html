<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #24292f;
      background: #fff;
    }
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #toolbar a {
      color: #cfe8ff;
      text-decoration: none;
      font-size: 12px;
    }
    #toolbar a:hover { text-decoration: underline; }
    #filepath { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #content {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }
    #status {
      max-width: 860px;
      margin: 40px auto;
      padding: 16px 24px;
      border-radius: 6px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
    }
    #status.error { background: #f8d7da; color: #721c24; }

    /* GitHub-ish Markdown styles */
    #content h1,#content h2,#content h3,#content h4,#content h5,#content h6 {
      margin-top: 1.4em; margin-bottom: .4em; font-weight: 600; line-height: 1.3;
    }
    #content h1 { font-size: 2em; border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
    #content h2 { font-size: 1.5em; border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
    #content p { margin: .8em 0; }
    #content a { color: #0969da; }
    #content code {
      background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 3px; padding: .1em .4em; font-size: .9em; font-family: 'SF Mono', Consolas, monospace;
    }
    #content pre {
      background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 6px; padding: 14px 16px; overflow-x: auto;
    }
    #content pre code { background: none; border: none; padding: 0; font-size: .875em; }
    #content blockquote {
      margin: .8em 0; padding: 0 1em;
      color: #57606a; border-left: 4px solid #d0d7de;
    }
    #content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    #content th, #content td {
      border: 1px solid #d0d7de; padding: 6px 13px;
    }
    #content th { background: #f6f8fa; font-weight: 600; }
    #content tr:nth-child(even) td { background: #f6f8fa; }
    #content img { max-width: 100%; }
    #content ul, #content ol { padding-left: 2em; margin: .8em 0; }
    #content li { margin: .3em 0; }
    #content hr { border: none; border-top: 1px solid #d0d7de; margin: 1.5em 0; }
    /* PR comments */
    .md-block { position: relative; }
    .md-add-comment {
      position: absolute; left: -48px; top: 4px; width: 22px; height: 22px;
      border: none; border-radius: 4px; background: #0078d4; color: #fff;
      font-size: 13px; line-height: 22px; cursor: pointer; padding: 0;
      opacity: 0; transition: opacity .1s;
    }
    .md-block:hover > .md-add-comment { opacity: 1; }
    .md-block.has-active > .md-body, .md-block.all-resolved > .md-body { border-left: 4px solid; padding-left: 14px; margin-left: -18px; }
    .md-block.has-active > .md-body { border-color: #0078d4; }
    .md-block.all-resolved > .md-body { border-color: #2da44e; }
    ::highlight(md-anchored) { background: #cfe8ff; }
    ::highlight(md-resolved) { background: #d2f4d9; }
    .md-sel-btn { position: fixed; z-index: 150; border: none; border-radius: 6px; background: #0078d4; color: #fff; font-size: 12px; padding: 4px 10px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .md-quote { border-left: 3px solid #8c959f; padding: 2px 8px; margin: 0 0 6px; color: #57606a; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .md-badge { position: absolute; right: -56px; top: 2px; border: 1px solid #0078d4; background: #ddf0ff; color: #0550ae; border-radius: 10px; font-size: 11px; padding: 0 7px; cursor: pointer; }
    .md-badge.resolved { border-color: #2da44e; background: #dafbe1; color: #1a7f37; }
    .md-threads[hidden] { display: none; }
    .md-threads { margin: 8px 0 12px; }
    .md-thread { border: 1px solid #d0d7de; border-left: 4px solid #0078d4; border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: #f6f8fa; font-size: 13px; }
    .md-thread.resolved { border-left-color: #2da44e; opacity: .75; }
    .md-thread-head { display: flex; justify-content: space-between; align-items: center; color: #57606a; font-size: 12px; margin-bottom: 6px; }
    .md-comment { padding: 6px 0; border-top: 1px solid #e5e8eb; }
    .md-comment:first-of-type { border-top: none; }
    .md-comment-head { font-size: 12px; color: #57606a; font-weight: 600; }
    .md-comment-body { white-space: pre-wrap; word-break: break-word; }
    .md-composer { margin: 8px 0; }
    .md-composer textarea { width: 100%; font: inherit; font-size: 13px; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; resize: vertical; }
    .md-composer-row { display: flex; gap: 8px; margin-top: 6px; }
    .md-btn { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
    .md-actions { display: inline-flex; gap: 6px; align-items: center; }
    .md-del-wrap { display: inline-flex; }
    .md-del { color: #cf222e; border-color: #f1b8bd; transition: background .15s, color .15s; }
    .md-del:hover { background: #cf222e; border-color: #cf222e; color: #fff; }
    .md-del-confirm { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border: 1px solid #f1b8bd; border-radius: 14px; background: #ffebe9; color: #a40e26; font-size: 12px; animation: md-pop .18s ease-out; }
    .md-del-confirm[hidden], .md-del[hidden] { display: none; }
    .md-yes { background: #cf222e; border-color: #cf222e; color: #fff; border-radius: 12px; }
    .md-yes:hover { background: #a40e26; }
    .md-no { border-radius: 12px; }
    @keyframes md-pop { from { opacity: 0; transform: translateX(8px) scale(.95); } to { opacity: 1; transform: none; } }
    .md-thread { transition: opacity .2s, transform .2s; }
    .md-thread.removing { opacity: 0; transform: translateX(-12px); }
    .md-btn.primary { background: #0078d4; border-color: #0078d4; color: #fff; }
    .md-btn:disabled { opacity: .5; cursor: default; }
    .md-toast { position: fixed; bottom: 16px; right: 16px; max-width: 420px; background: #f8d7da; color: #721c24; padding: 10px 14px; border-radius: 6px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.2); z-index: 200; }
    .mermaid-diagram { margin: 1em 0; overflow-x: auto; }
    .mermaid-diagram svg { max-width: 100%; height: auto; display: block; }
    .plantuml-diagram { margin: 1em 0; overflow-x: auto; }
    .plantuml-diagram img { max-width: 100%; display: block; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="filepath">Loading…</span>
    <a id="sourceLink" href="#" target="_blank">View source ↗</a>
  </div>
  <div id="status">Fetching file…</div>
  <div id="content" style="display:none"></div>

  <script src="lib/marked.min.js"></script>
  <script src="lib/pako.min.js"></script>
  <script src="lib/mermaid.min.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="azure-comments.js"></script>
  <script src="render-md.js"></script>
</body>
</html>
