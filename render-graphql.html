<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="shell.css" />
  <style>
    html, body { height: 100%; }
    #frame-wrap { position: absolute; top: 60px; left: 0; right: 0; bottom: 0; background: var(--bg); }
    #frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
    /* Voyager is sandboxed and unthemed: invert for dark mode, keep hues. */
    :root[data-theme="dark"] #frame-wrap iframe { filter: invert(.92) hue-rotate(180deg) contrast(.95); }
    #status { position: absolute; top: 60px; left: 0; right: 0; z-index: 200; margin: 40px auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="left">
      <div class="logo" id="logo" data-icon="graph"></div>
      <span id="filepath">Loading…</span>
    </div>
    <div class="right">
      <div id="themeToggle"></div>
      <a id="sourceLink" href="#" target="_blank">View source ↗</a>
    </div>
  </div>
  <div id="status">Fetching schema…</div>
  <div id="frame-wrap">
    <iframe id="voyagerFrame" src="voyager-sandbox.html" sandbox="allow-scripts"></iframe>
  </div>

  <script src="azure-fetch.js"></script>
  <script src="shell.js"></script>
  <script src="render-graphql.js"></script>
</body>
</html>
