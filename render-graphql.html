<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0;
      color: #24292f;
    }
    #toolbar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      height: 34px;
    }
    #toolbar a {
      color: #cfe8ff;
      text-decoration: none;
      font-size: 12px;
    }
    #toolbar a:hover { text-decoration: underline; }
    #filepath { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #frame-wrap {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
    }
    #frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #status {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      z-index: 200;
      max-width: 860px;
      margin: 40px auto;
      padding: 16px 24px;
      border-radius: 6px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
      white-space: pre-wrap;
    }
    #status.error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="filepath">Loading…</span>
    <a id="sourceLink" href="#" target="_blank">View source ↗</a>
  </div>
  <div id="status">Fetching schema…</div>
  <div id="frame-wrap">
    <iframe id="voyagerFrame" src="voyager-sandbox.html" sandbox="allow-scripts"></iframe>
  </div>

  <script src="azure-fetch.js"></script>
  <script src="render-graphql.js"></script>
</body>
</html>
