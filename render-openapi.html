<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="lib/swagger-ui.css" />
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --ink: #1B1B22; --ink2: #5B5B68; --ink3: #8A8A98;
      --line: #E8E5DE; --accent: #5B4BFF; --accent-soft: #EEECFF; --hover: #F6F4FF; --code: #EFECE5;
      --input: #FBFAF7; --grad: linear-gradient(135deg, #6A5CFF, #B05CFF);
      --shadow: #1B1B221A; --toggle-shadow: #1B1B221A; --err-bg: #FDE4E4; --err-ink: #8A1F1F;
      --amber: #F0B429; --amber-soft: #FFF0B8; --amber-ink: #7A5200; --hl: #FFF0B8;
      --green: #188A5C; --green-soft: #E4F5EC; --red: #C9372C; --red-soft: #FDECEA;
      --get: #1F6FEB; --get-soft: #E6F0FF; --post: #188A5C; --post-soft: #E4F5EC;
      --put: #C77700; --put-soft: #FFF3DC; --patch: #0E8A96; --patch-soft: #DFF4F6;
      --delete: #C9372C; --delete-soft: #FDECEA; --other: #6B6B7B; --other-soft: #EFEDE8;
      --pill-ink: #FFFFFF;
      color-scheme: light;
      --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    }
    :root[data-theme="dark"] {
      --bg: #0B0F14; --surface: #11161D; --ink: #D6DEEB; --ink2: #8E9BAE; --ink3: #6B778A;
      --line: #1E2631; --accent: #7AA2FF; --accent-soft: #15203A; --hover: #101826; --code: #151B24;
      --input: #0B0F14; --grad: linear-gradient(135deg, #2F6BFF, #7C4DFF);
      --shadow: #00000066; --toggle-shadow: #00000080; --err-bg: #3A1618; --err-ink: #FFB4AE;
      --amber: #E3B341; --amber-soft: #3B2F0E; --amber-ink: #F0C75E; --hl: #3B2F0E;
      --green: #3FB950; --green-soft: #11261A; --red: #F47067; --red-soft: #2D1416;
      --get: #58A6FF; --get-soft: #112440; --post: #3FB950; --post-soft: #11261A;
      --put: #E3B341; --put-soft: #2E2410; --patch: #39C5CF; --patch-soft: #0F2A2D;
      --delete: #F47067; --delete-soft: #2D1416; --other: #8E9BAE; --other-soft: #1A212B;
      --pill-ink: #0B0F14;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--bg); }
    button { font-family: inherit; }
    svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* ---- top bar ---- */
    #toolbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; }
    #toolbar .left, #toolbar .right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #toolbar .left { flex: 1; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; font-size: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .chip[hidden] { display: none; }
    #filepath { color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #filepath b { color: var(--ink); font-weight: 600; }
    #viewToggle { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
    #viewToggle button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink2); cursor: pointer; }
    #viewToggle button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px var(--toggle-shadow); }
    .theme-sw { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
    .theme-sw button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; color: var(--ink3); font-size: 14px; display: inline-flex; cursor: pointer; }
    .theme-sw button.on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px var(--toggle-shadow); }

    #status { max-width: 860px; margin: 40px auto; padding: 16px 24px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13px; }
    #status.error { background: var(--err-bg); color: var(--err-ink); }
    #warning { margin: 16px 28px 0; padding: 10px 16px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13px; }
    #warning[hidden], #status[hidden] { display: none; }

    /* ---- body: rail | main | aside ---- */
    #app { flex: 1; min-height: 0; display: flex; }
    #app[hidden] { display: none; }
    #rail { flex: 0 0 268px; width: 268px; padding: 28px 16px 28px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .sec-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); padding: 0 12px 6px 4px; }
    .sec-title.gap { padding-top: 22px; }
    .rrow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; border: 0; border-radius: 8px; background: none; color: var(--ink2); font-size: 13.5px; line-height: 1.3; text-align: left; cursor: pointer; }
    .rrow:hover { background: var(--hover); }
    .rrow.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .rrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rrow.group { color: var(--ink); font-weight: 600; cursor: default; margin-top: 2px; }
    .rrow.group:hover { background: none; }
    .rrow.group .n { font-size: 12px; font-weight: 400; color: var(--ink3); }
    .rrow.op { padding: 6px 12px; gap: 8px; }
    .rrow.op .m { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--mc, var(--other)); width: 30px; flex: none; }
    .rrow.op .t { font-family: var(--mono); font-size: 12px; }
    .rrow.op.active { background: var(--mcs, var(--accent-soft)); color: var(--ink); }
    .m-get { --mc: var(--get); --mcs: var(--get-soft); } .m-post { --mc: var(--post); --mcs: var(--post-soft); }
    .m-put { --mc: var(--put); --mcs: var(--put-soft); } .m-patch { --mc: var(--patch); --mcs: var(--patch-soft); }
    .m-delete { --mc: var(--delete); --mcs: var(--delete-soft); }

    #main { flex: 1; min-width: 0; overflow-y: auto; scroll-behavior: smooth; padding: 28px 48px 64px; }
    #main > .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
    #header { display: flex; flex-direction: column; gap: 18px; }
    #badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--code); color: var(--ink2); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.accent { background: var(--accent-soft); color: var(--accent); }
    #title { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    .desc { display: flex; flex-direction: column; gap: 14px; font-size: 14.5px; line-height: 1.55; color: var(--ink2); }
    .desc > :first-child { font-size: 17px; line-height: 1.5; color: var(--ink); }
    .desc > h1:first-child, .desc > h2:first-child { font-size: 20px; color: var(--ink); }
    .desc h1, .desc h2, .desc h3, .desc h4 { margin: 18px 0 0; color: var(--ink); font-weight: 700; letter-spacing: -.01em; line-height: 1.25; scroll-margin-top: 16px; }
    .desc h1, .desc h2 { font-size: 20px; } .desc h3 { font-size: 16px; } .desc h4 { font-size: 14.5px; }
    .desc p, .desc ul, .desc ol, .desc pre, .desc table, .desc blockquote { margin: 0; }
    .desc ul, .desc ol { padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
    .desc a { color: var(--accent); text-decoration: none; } .desc a:hover { text-decoration: underline; }
    .desc code { font-family: var(--mono); font-size: .86em; padding: 1px 6px; border-radius: 5px; background: var(--code); color: var(--ink); }
    .desc pre { padding: 12px 14px; border-radius: 10px; background: var(--code); overflow-x: auto; }
    .desc pre code { padding: 0; background: none; font-size: 12.5px; }
    .desc blockquote { padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); }
    .desc table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); font-size: 14px; }
    .desc th { text-align: left; padding: 10px 20px; background: var(--bg); color: var(--ink3); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .desc td { padding: 14px 20px; border-top: 1px solid var(--line); color: var(--ink); }
    .desc img { max-width: 100%; }
    .desc hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
    #ext { display: flex; gap: 8px; flex-wrap: wrap; }
    #ext a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; text-decoration: none; }
    #ext a:hover { filter: brightness(.97); }
    #ext:empty { display: none; }

    #aside { flex: 0 0 342px; width: 342px; padding: 28px 32px 28px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 32px; }
    #aside .blk { display: flex; flex-direction: column; gap: 10px; }
    .srv { display: flex; flex-direction: column; gap: 3px; padding: 11px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
    .srv b { font-family: var(--mono); font-size: 12.5px; font-weight: 600; word-break: break-all; }
    .srv span { font-size: 12px; color: var(--ink3); }
    .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--ink2); }
    .kv b { font-family: var(--mono); font-weight: 600; color: var(--ink); text-align: right; word-break: break-word; }
    #download { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--ink2); font-size: 13px; font-weight: 600; cursor: pointer; }
    #download:hover { background: var(--hover); color: var(--ink); }
    #download .ic { font-size: 15px; }

    /* ---- source view ---- */
    #source { display: none; flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 20px 0 40px; font: 13px/1.65 var(--mono); }
    #source .ln { display: flex; padding: 0 28px 0 0; }
    #source .n { flex: none; width: 56px; padding-right: 16px; text-align: right; color: var(--ink3); user-select: none; }
    #source .c { white-space: pre-wrap; word-break: break-word; min-width: 0; }
    body.view-source #app { display: none; }
    body.view-source #source { display: block; }

    @media (max-width: 1280px) { #aside { display: none; } }
    @media (max-width: 1000px) { #rail { display: none; } #main { padding: 24px 20px 48px; } #toolbar { padding: 0 16px; } .chip + #filepath { display: none; } }

    /* ================= Swagger UI re-skin ================= */
    #swagger-ui { font-family: var(--font); }
    #swagger-ui .information-container, #swagger-ui .scheme-container, #swagger-ui .topbar { display: none !important; }
    #swagger-ui .wrapper { padding: 0; max-width: none; }
    #swagger-ui * { color: inherit; font-family: inherit; }
    #swagger-ui { color: var(--ink); }
    #swagger-ui code, #swagger-ui pre, #swagger-ui .opblock-summary-path, #swagger-ui .parameter__name, #swagger-ui .parameter__type,
    #swagger-ui .parameter__in, #swagger-ui .response-col_status, #swagger-ui .prop-type, #swagger-ui .prop-format, #swagger-ui .model-title { font-family: var(--mono); }
    #swagger-ui svg { fill: currentColor; }

    #swagger-ui .opblock-tag-section { margin-bottom: 36px; }
    #swagger-ui .opblock-tag { display: flex; align-items: baseline; gap: 14px; padding: 0 0 14px; margin: 0; border: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
    #swagger-ui .opblock-tag:hover { background: none; }
    #swagger-ui .opblock-tag a { color: var(--ink); font-size: 22px; font-weight: 700; }
    #swagger-ui .opblock-tag small { flex: 1; padding: 0; font-size: 14px; font-weight: 400; color: var(--ink3); }
    #swagger-ui .opblock-tag small .markdown p, #swagger-ui .opblock-tag small p { color: var(--ink3); }
    #swagger-ui .opblock-tag .expand-operation { margin-left: auto; }
    #swagger-ui .opblock-tag svg, #swagger-ui .expand-methods svg, #swagger-ui .expand-operation svg { fill: var(--ink3); }
    #swagger-ui .opblock-tag-section > div > div { display: flex; flex-direction: column; gap: 12px; }

    #swagger-ui .opblock { margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: none; overflow: hidden; }
    #swagger-ui .opblock .opblock-summary { display: flex; align-items: center; padding: 13px 18px; border: 0; cursor: pointer; }
    #swagger-ui .opblock .opblock-summary:hover { background: var(--hover); }
    #swagger-ui .opblock .opblock-summary-control { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
    #swagger-ui .opblock .opblock-summary-path a { color: inherit; text-decoration: none; }
    #swagger-ui .opblock .opblock-summary-method { min-width: 62px; padding: 5px 0; border-radius: 6px; background: var(--mc, var(--other)); color: var(--pill-ink); font-size: 12px; font-weight: 700; text-align: center; text-shadow: none; flex: none; font-family: var(--mono); }
    #swagger-ui .opblock .opblock-summary-path { flex: 0 0 auto; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0; font-size: 14px; font-weight: 600; color: var(--ink); word-break: break-all; }
    #swagger-ui .opblock .opblock-summary-path__deprecated { text-decoration: line-through; }
    #swagger-ui .opblock .opblock-summary-description { flex: 1; min-width: 0; padding: 0; font-size: 13.5px; color: var(--ink2); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #swagger-ui .opblock .opblock-summary-control svg, #swagger-ui .opblock .authorization__btn svg { fill: var(--ink3); }
    #swagger-ui .opblock.opblock-get { --mc: var(--get); --mcs: var(--get-soft); } #swagger-ui .opblock.opblock-post { --mc: var(--post); --mcs: var(--post-soft); }
    #swagger-ui .opblock.opblock-put { --mc: var(--put); --mcs: var(--put-soft); } #swagger-ui .opblock.opblock-patch { --mc: var(--patch); --mcs: var(--patch-soft); }
    #swagger-ui .opblock.opblock-delete { --mc: var(--delete); --mcs: var(--delete-soft); }
    #swagger-ui .opblock.opblock-head, #swagger-ui .opblock.opblock-options { --mc: var(--other); --mcs: var(--other-soft); }
    #swagger-ui .opblock.opblock-deprecated { opacity: .6; }
    #swagger-ui .opblock.is-open { border-color: var(--mc, var(--line)); }
    #swagger-ui .opblock.is-open .opblock-summary { background: var(--mcs, var(--hover)); }
    #swagger-ui .opblock .opblock-body { background: var(--surface); }
    #swagger-ui .opblock .opblock-description-wrapper, #swagger-ui .opblock .opblock-external-docs-wrapper, #swagger-ui .opblock .opblock-title_normal { padding: 22px 24px 0; margin: 0; font-size: 14px; color: var(--ink2); }
    #swagger-ui .opblock-description-wrapper p, #swagger-ui .markdown p, #swagger-ui .renderedMarkdown p { margin: 0 0 8px; font-size: inherit; color: inherit; line-height: 1.55; }
    #swagger-ui .opblock-section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; margin: 0; background: none; box-shadow: none; border-bottom: 1px solid var(--line); }
    #swagger-ui .opblock-section-header h4 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
    #swagger-ui .opblock-section-header label { color: var(--ink2); font-size: 12px; }
    #swagger-ui .opblock-section-header label span { padding: 0 8px 0 0; }
    #swagger-ui .opblock-body .opblock-section > * { margin-left: 0; }
    #swagger-ui .opblock .tab-header { padding: 0; }
    #swagger-ui .opblock .tab-header .tab-item { padding: 0 18px 0 0; cursor: pointer; }
    #swagger-ui .opblock .tab-header .tab-item.active h4 span { color: var(--accent); }
    #swagger-ui .opblock .tab-header .tab-item.active h4 span:after { background: var(--accent); }

    #swagger-ui .parameters-container, #swagger-ui .responses-wrapper { padding: 0; }
    #swagger-ui .opblock-body .table-container, #swagger-ui .responses-inner { padding: 4px 24px 22px; }
    #swagger-ui .parameter__name.required > span { display: none; }
    #swagger-ui .opblock-body .opblock-section-header + div { margin: 0; }
    #swagger-ui table { width: 100%; border-collapse: collapse; background: none; }
    #swagger-ui table thead tr th, #swagger-ui table thead tr td { padding: 12px 0 8px; border: 0; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); text-align: left; }
    #swagger-ui table tbody tr td { padding: 16px 0; border: 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink2); font-size: 13.5px; }
    #swagger-ui table tbody tr:last-child td { border-bottom: 0; }
    #swagger-ui .parameters-col_name { width: 240px; padding-right: 24px; }
    #swagger-ui .parameter__name { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
    #swagger-ui .parameter__name.required { color: var(--ink); }
    #swagger-ui .parameter__name.required span, #swagger-ui .parameter__name.required:after { color: var(--red); }
    #swagger-ui .parameter__name.required:after { content: 'required'; position: static; display: block; margin-top: 3px; font-family: var(--font); font-size: 11px; font-weight: 600; }
    #swagger-ui .parameter__type { margin: 4px 0 0; font-size: 12px; font-weight: 400; color: var(--ink3); }
    #swagger-ui .parameter__in { display: inline-block; margin-top: 6px; padding: 2px 7px; border-radius: 5px; background: var(--code); font-family: var(--font); font-size: 11px; font-style: normal; font-weight: 600; color: var(--ink2); }
    #swagger-ui .parameter__deprecated { color: var(--red); }
    #swagger-ui .parameter__enum, #swagger-ui .parameter__default { font-size: 12px; color: var(--ink3); }

        #swagger-ui .responses-inner h4, #swagger-ui .responses-inner h5 { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--ink3); }
    #swagger-ui .responses-table .response-col_status { width: 90px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
    #swagger-ui .responses-table .response-col_links { width: 120px; color: var(--ink3); }
    #swagger-ui .response-col_description { color: var(--ink); }
    #swagger-ui .response-col_description__inner, #swagger-ui .response-col_description .markdown p { color: var(--ink); }
    #swagger-ui .response-controls { color: var(--ink3); }
    #swagger-ui .responses-table.live-responses-table { display: none; }
    #swagger-ui .response .response-col_status { color: var(--ink); }

    #swagger-ui select, #swagger-ui input[type=text], #swagger-ui input[type=password], #swagger-ui input[type=search], #swagger-ui input[type=email], #swagger-ui input[type=file], #swagger-ui textarea {
      background: var(--input); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; box-shadow: none; font-size: 13px; font-family: var(--mono); }
    #swagger-ui select { padding-right: 28px; }
    #swagger-ui label, #swagger-ui .markdown, #swagger-ui .renderedMarkdown { color: var(--ink2); }
    #swagger-ui .markdown code, #swagger-ui .renderedMarkdown code { padding: 1px 6px; border-radius: 5px; background: var(--code); color: var(--ink); font-size: .9em; }
    #swagger-ui a { color: var(--accent); }
    #swagger-ui .btn { border: 1px solid var(--line); border-radius: 8px; background: none; box-shadow: none; color: var(--ink2); font-weight: 600; }
    #swagger-ui .btn:hover { background: var(--hover); box-shadow: none; }
    #swagger-ui .btn.execute { background: var(--accent); border-color: var(--accent); color: var(--pill-ink); }

    #swagger-ui pre, #swagger-ui .highlight-code > .microlight, #swagger-ui .opblock-body pre.microlight { background: var(--code) !important; color: var(--ink) !important; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.55; }
    #swagger-ui .microlight span { color: inherit !important; }
    #swagger-ui .highlight-code pre.microlight, #swagger-ui .example pre { white-space: pre-wrap; }
    #swagger-ui .copy-to-clipboard { background: var(--surface); border-radius: 6px; }
    #swagger-ui .copy-to-clipboard button { background: none; }
    #swagger-ui .model-example .tab, #swagger-ui .tab { padding: 0; margin: 0 0 8px; }
    #swagger-ui ul.tab { display: flex; gap: 14px; list-style: none; border-bottom: 1px solid var(--line); }
    #swagger-ui ul.tab li { padding: 6px 0; font-size: 13px; font-weight: 500; color: var(--ink3); }
    #swagger-ui ul.tab li.active { color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
    #swagger-ui ul.tab li:after { display: none; }

    #swagger-ui .model-box { background: none; padding: 0; }
    #swagger-ui .model, #swagger-ui .model-title, #swagger-ui .prop-name, #swagger-ui .model .property { color: var(--ink); font-size: 13px; }
    #swagger-ui .model .property.primitive, #swagger-ui .prop-type, #swagger-ui .prop-format, #swagger-ui .model-toggle:after { color: var(--ink3); }
    #swagger-ui .prop-type { color: var(--accent); }
    #swagger-ui table.model tbody tr td { padding: 5px 0; border: 0; font-size: 13px; }
    #swagger-ui .model-toggle { cursor: pointer; }
    #swagger-ui .model-box-control, #swagger-ui .models-control { color: var(--ink); background: none; }
    #swagger-ui .json-schema-2020-12 { background: var(--bg); border-color: var(--line); }
    #swagger-ui .json-schema-2020-12__title, #swagger-ui .json-schema-2020-12-keyword__name { color: var(--ink); }
    #swagger-ui .json-schema-2020-12-keyword__value, #swagger-ui .json-schema-2020-12__attribute { color: var(--ink2); }

    #swagger-ui section.models { margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    #swagger-ui section.models.is-open h4 { border-bottom: 1px solid var(--line); }
    #swagger-ui section.models h4 { margin: 0; padding: 14px 18px; font-size: 18px; font-weight: 700; color: var(--ink); }
    #swagger-ui section.models .model-container { margin: 0; padding: 4px 18px; background: none; border: 0; border-radius: 0; }
    #swagger-ui section.models .model-container:hover { background: var(--hover); }
    #swagger-ui section.models h5 { color: var(--ink); }
    #swagger-ui .errors-wrapper { background: var(--red-soft); border: 1px solid var(--red); border-radius: 10px; color: var(--red); }
    #swagger-ui .loading-container { padding: 20px; }
    #swagger-ui .opblock-tag-section .opblock .authorization__btn { display: none; }
    #swagger-ui .try-out { display: none; }
    #swagger-ui .opblock-summary-control:focus { outline: none; }
    #swagger-ui .opblock-summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  </style>
</head>
