<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      background: #fff;
    }
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #toolbar a {
      color: #cfe8ff;
      text-decoration: none;
      font-size: 12px;
    }
    #toolbar a:hover { text-decoration: underline; }
    #filepath { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status {
      max-width: 860px;
      margin: 40px auto;
      padding: 16px 24px;
      border-radius: 6px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
    }
    #status.error { background: #f8d7da; color: #721c24; }
    #warning {
      margin: 12px 24px 0;
      padding: 10px 16px;
      border-radius: 6px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
      display: none;
    }
    #swagger-ui { padding-top: 4px; }
    /* Fix Swagger UI z-index conflicts with our toolbar */
    .swagger-ui .topbar { display: none; }
    .swagger-ui .information-container { padding-top: 16px; }
  </style>
  <link rel="stylesheet" href="lib/swagger-ui.css" />
  <link rel="stylesheet" href="lib/swagger-ui-theme-flattop.css" />
</head>
<body>
  <div id="toolbar">
    <span id="filepath">Loading…</span>
    <a id="sourceLink" href="#" target="_blank">View source ↗</a>
  </div>
  <div id="warning"></div>
  <div id="status">Fetching file…</div>
  <div id="swagger-ui" style="display:none"></div>

  <script src="lib/js-yaml.min.js"></script>
  <script src="lib/swagger-ui-bundle.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="render-openapi.js"></script>
</body>
</html>
