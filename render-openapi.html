<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="shell.css" />
  <style>
    body { font-size: 15px; }
    #warning { margin: 12px 24px 0; padding: 10px 16px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13px; display: none; }
    #swagger-ui { padding-top: 4px; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .information-container { padding-top: 16px; }
    /* Swagger UI has no theme tokens: invert it for dark mode, keep hues. */
    :root[data-theme="dark"] #swagger-ui { background: #fff; filter: invert(.92) hue-rotate(180deg) contrast(.95); }
    :root[data-theme="dark"] #swagger-ui img, :root[data-theme="dark"] #swagger-ui .swagger-ui .model-box svg { filter: invert(1) hue-rotate(180deg); }
  </style>
  <link rel="stylesheet" href="lib/swagger-ui.css" />
  <link rel="stylesheet" href="lib/swagger-ui-theme-flattop.css" />
</head>
<body>
  <div id="toolbar">
    <div class="left">
      <div class="logo" id="logo" data-icon="api"></div>
      <span id="filepath">Loading…</span>
    </div>
    <div class="right">
      <div id="themeToggle"></div>
      <a id="sourceLink" href="#" target="_blank">View source ↗</a>
    </div>
  </div>
  <div id="warning"></div>
  <div id="status">Fetching file…</div>
  <div id="swagger-ui" style="display:none"></div>

  <script src="lib/js-yaml.min.js"></script>
  <script src="lib/swagger-ui-bundle.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="shell.js"></script>
  <script src="render-openapi.js"></script>
</body>
</html>
