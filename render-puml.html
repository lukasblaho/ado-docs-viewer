<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="shell.css" />
  <style>
    body { overflow: hidden; }
    #diagram-wrap { width: 100%; height: calc(100vh - 60px); overflow: auto; padding: 28px; }
    #diagram-wrap img { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px var(--shadow); padding: 16px; display: block; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="left">
      <div class="logo" id="logo" data-icon="workflow"></div>
      <span id="filepath">Loading…</span>
    </div>
    <div class="right">
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
        <span id="zoom-level">100%</span>
        <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
        <button class="zoom-btn" id="zoomReset" title="Reset zoom" style="font-size:12px;">1:1</button>
      </div>
      <div id="themeToggle"></div>
      <a id="sourceLink" href="#" target="_blank">View source ↗</a>
      <a id="svgLink" href="#" target="_blank" style="display:none">Open SVG ↗</a>
    </div>
  </div>
  <div id="status">Fetching diagram…</div>
  <div id="diagram-wrap" style="display:none">
    <img id="diagram" alt="PlantUML diagram" />
  </div>

  <script src="lib/pako.min.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="shell.js"></script>
  <script src="render-puml.js"></script>
</body>
</html>
