<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="theme-init.js"></script>
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --ink: #1B1B22; --ink2: #5B5B68; --ink3: #8A8A98;
      --line: #E8E5DE; --accent: #5B4BFF; --accent-soft: #EEECFF; --hover: #F6F4FF; --code: #EFECE5;
      --sel: #CFC8FF; --grad: linear-gradient(135deg, #6A5CFF, #B05CFF);
      --shadow: #1B1B221A; --toggle-shadow: #1B1B221A; --err-bg: #FDE4E4; --err-ink: #8A1F1F;
      --amber-soft: #FFF0B8; --amber-ink: #7A5200; --hl: #FFF0B8;
      color-scheme: light;
      --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    }
    :root[data-theme="dark"] {
      --bg: #0B0F14; --surface: #11161D; --ink: #D6DEEB; --ink2: #8E9BAE; --ink3: #6B778A;
      --line: #1E2631; --accent: #7AA2FF; --accent-soft: #15203A; --hover: #101826; --code: #151B24;
      --sel: #22407A; --grad: linear-gradient(135deg, #2F6BFF, #7C4DFF);
      --shadow: #00000066; --toggle-shadow: #00000080; --err-bg: #3A1618; --err-ink: #FFB4AE;
      --amber-soft: #3B2F0E; --amber-ink: #F0C75E; --hl: #3B2F0E;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--bg); }
    button { font-family: inherit; }
    svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* ---- top bar ---- */
    #toolbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; }
    #toolbar .left, #toolbar .right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #toolbar .left { flex: 1; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; font-size: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .chip[hidden] { display: none; }
    #filepath { color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #filepath b { color: var(--ink); font-weight: 600; }
    #viewToggle { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
    #viewToggle button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink2); cursor: pointer; }
    #viewToggle button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px var(--toggle-shadow); }
    .theme-sw { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
    .theme-sw button { border: 0; background: none; padding: 5px 9px; border-radius: 8px; color: var(--ink3); font-size: 14px; display: inline-flex; cursor: pointer; }
    .theme-sw button.on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px var(--toggle-shadow); }

    #status { max-width: 860px; margin: 40px auto; padding: 16px 24px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-ink); font-size: 13px; }
    #status.error { background: var(--err-bg); color: var(--err-ink); }

    /* ---- body: elements | canvas ---- */
    #app { flex: 1; min-height: 0; display: flex; }
    #app[hidden] { display: none; }
    #elements { flex: 0 0 268px; width: 268px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px 16px 4px 28px; overflow: hidden; }
    #outline { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-right: -8px; padding-right: 8px; }
    .sec-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); padding: 10px 12px 4px 4px; }
    .sec-title:first-child { padding-top: 0; }
    .row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px 7px 4px; border: 0; border-radius: 9px; background: none; color: var(--ink2); font-size: 13.5px; line-height: 1.3; text-align: left; cursor: pointer; }
    .row:hover { background: var(--hover); }
    .row.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .row .ic { font-size: 14px; color: var(--ink3); }
    .row.active .ic { color: var(--accent); }
    .row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .chev { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; }
    .row .chev:hover { background: var(--accent-soft); color: var(--accent); }
    .row .chev .ic { transition: transform .12s; font-size: 13px; }
    .row.open .chev .ic { transform: rotate(90deg); }
    .row.leaf { padding-left: 28px; }
    .kids { display: flex; flex-direction: column; gap: 2px; padding-left: 14px; }
    .kids[hidden] { display: none; }

    #legend { flex: none; display: flex; flex-direction: column; gap: 9px; padding: 14px 0 18px; border-top: 1px solid var(--line); max-height: 44%; overflow-y: auto; }
    #legend[hidden] { display: none; }
    #legend h4 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink3); }
    #legend .sub { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink3); text-transform: uppercase; margin-top: 2px; }
    #legend .lg { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink2); }
    #legend .lg svg { width: 28px; height: 16px; flex: none; fill: none; stroke: var(--ink2); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
    #legend .lg svg .bg { fill: var(--surface); }
    #legend .lg svg .fg { fill: var(--ink2); }

    #canvas { position: relative; flex: 1; min-width: 0; overflow: hidden; }
    #viewport { position: absolute; inset: 0; cursor: grab; touch-action: none; user-select: none; overflow: hidden; }
    #viewport.dragging { cursor: grabbing; }
    #stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; border-radius: 10px; padding: 16px; box-shadow: 0 2px 10px var(--shadow); line-height: 0; }
    #viewport.animate #stage { transition: transform .22s ease-out; }
    #stage svg { display: block; max-width: none; background: transparent !important; }
    #stage g.entity, #stage g.cluster, #stage g.link { transition: opacity .15s; }
    #stage g.entity { cursor: pointer; }
    #stage.has-sel g.entity:not(.sel):not(.rel), #stage.has-sel g.link:not(.rel-link), #stage.has-sel g.cluster:not(.sel):not(.anc) { opacity: .28; }
    #stage .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; pointer-events: none; }
    #stage .sel-halo { fill: var(--accent); fill-opacity: .08; pointer-events: none; }

    .float { position: absolute; z-index: 5; }
    #titleBlock { top: 24px; left: 28px; display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 420px); pointer-events: none; }
    #titleBlock h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
    #titleBlock .meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink3); }

    #inspector { top: 24px; right: 28px; width: 290px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 16px var(--shadow); }
    #inspector[hidden] { display: none; }
    #inspector .head { display: flex; gap: 10px; align-items: center; }
    #inspector .icon-chip { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 16px; flex: none; }
    #inspector .name { font-size: 15px; font-weight: 700; line-height: 1.25; word-break: break-word; }
    #inspector .kind { font-size: 12px; color: var(--ink3); }
    #inspector .close { margin-left: auto; align-self: flex-start; width: 24px; height: 24px; border: 0; border-radius: 7px; background: none; color: var(--ink3); cursor: pointer; font-size: 14px; display: grid; place-items: center; flex: none; }
    #inspector .close:hover { background: var(--hover); color: var(--ink); }
    #inspector .rels { display: flex; gap: 8px; flex-wrap: wrap; }
    #inspector .rel { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--bg); color: var(--ink2); font-size: 12px; font-weight: 500; }
    #inspector .rel .ic { font-size: 12px; }
    #inspector .acts { display: flex; gap: 8px; }
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 10px; border: 0; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn:hover { filter: brightness(.97); }
    .btn.primary { background: var(--accent); color: #fff; }
    :root[data-theme="dark"] .btn.primary { color: #0B0F14; }

    #zoomBar { bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px var(--shadow); white-space: nowrap; }
    #zoomBar button, #zoomBar a { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; min-width: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--ink2); font-size: 12.5px; font-weight: 500; text-decoration: none; cursor: pointer; }
    #zoomBar button:hover, #zoomBar a:hover { background: var(--hover); color: var(--ink); }
    #zoomBar button.icon { padding: 0; width: 30px; }
    #zoomBar button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    #zoomBar .ic { font-size: 14px; }
    #zoomBar .ic.small { font-size: 13px; color: var(--ink3); }
    #zoomLevel { width: 46px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--ink); }
    #zoomBar .div { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }

    /* ---- source view ---- */
    #source { display: none; flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 20px 0 40px; font: 13px/1.65 var(--mono); }
    #source .ln { display: flex; padding: 0 28px 0 0; }
    #source .ln.hl { background: var(--hl); }
    #source .n { flex: none; width: 56px; padding-right: 16px; text-align: right; color: var(--ink3); user-select: none; }
    #source .c { white-space: pre-wrap; word-break: break-word; min-width: 0; }
    body.view-source #app { display: none; }
    body.view-source #source { display: block; }

    @media (max-width: 1100px) {
      #elements { display: none; }
      #titleBlock { max-width: calc(100% - 360px); }
      #toolbar { padding: 0 16px; }
      .chip + #filepath { display: none; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="left">
      <div class="logo" id="logo"></div>
      <span class="chip" id="chip" hidden></span>
      <span id="filepath">Loading…</span>
    </div>
    <div class="right">
      <div id="viewToggle"><button class="on" data-view="rendered">Rendered</button><button data-view="source">Source</button></div>
      <div id="themeToggle" class="theme-sw" role="group" aria-label="Theme"><button data-theme="light" title="Light theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"/></svg></button><button data-theme="dark" title="Dark theme"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button></div>
    </div>
  </div>

  <div id="status">Fetching diagram…</div>

  <div id="app" hidden>
    <aside id="elements">
      <nav id="outline" aria-label="Diagram elements"></nav>
      <div id="legend" hidden></div>
    </aside>
    <main id="canvas">
      <div id="viewport"><div id="stage"></div></div>

      <div id="titleBlock" class="float">
        <h1 id="diagTitle"></h1>
        <div class="meta"><span class="chip" id="kindChip"></span><span id="counts"></span></div>
      </div>

      <div id="inspector" class="float" hidden>
        <div class="head">
          <div class="icon-chip" id="inspIcon"></div>
          <div><div class="name" id="inspName"></div><div class="kind" id="inspKind"></div></div>
          <button class="close" id="inspClose" title="Clear selection (Esc)"></button>
        </div>
        <div class="rels"><span class="rel" id="inspIn"></span><span class="rel" id="inspOut"></span></div>
        <div class="acts">
          <button class="btn primary" id="inspSource"></button>
          <button class="btn" id="inspCopy"></button>
        </div>
      </div>

      <div id="zoomBar" class="float">
        <button class="icon" id="zoomOut" title="Zoom out (-)"></button>
        <span id="zoomLevel">100%</span>
        <button class="icon" id="zoomIn" title="Zoom in (+)"></button>
        <span class="div"></span>
        <button id="zoomReset" title="Actual size (0)">1:1</button>
        <button id="zoomFit" class="on" title="Fit to screen (F)">Fit</button>
        <span class="div"></span>
        <button id="viewSource" title="View PlantUML source"></button>
        <a id="svgLink" href="#" target="_blank" rel="noopener" title="Open rendered SVG"></a>
      </div>
    </main>
  </div>
  <pre id="source"></pre>

  <script src="lib/pako.min.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="render-puml.js"></script>
</body>
</html>
