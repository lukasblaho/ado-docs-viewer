<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0;
      color: #24292f;
      overflow: hidden; /* scrolling handled by #diagram-wrap */
    }
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #toolbar a {
      color: #cfe8ff;
      text-decoration: none;
      font-size: 12px;
    }
    #toolbar a:hover { text-decoration: underline; }
    #filepath { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .zoom-controls { display: flex; align-items: center; gap: 4px; }
    .zoom-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      width: 28px; height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .zoom-btn:hover { background: rgba(255,255,255,0.25); }
    #zoom-level { font-size: 12px; min-width: 40px; text-align: center; }
    #status {
      max-width: 860px;
      margin: 40px auto;
      padding: 16px 24px;
      border-radius: 6px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
    }
    #status.error { background: #f8d7da; color: #721c24; }
    #diagram-wrap {
      width: 100%;
      height: calc(100vh - 50px);
      overflow: auto;
      padding: 24px;
      box-sizing: border-box;
    }
    #diagram-wrap img {
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      padding: 16px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="filepath">Loading…</span>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
      <button class="zoom-btn" id="zoomReset" title="Reset zoom" style="width:auto;padding:0 8px;font-size:12px;">1:1</button>
    </div>
    <a id="sourceLink" href="#" target="_blank">View source ↗</a>
    <a id="svgLink" href="#" target="_blank" style="display:none">Open SVG ↗</a>
  </div>
  <div id="status">Fetching diagram…</div>
  <div id="diagram-wrap" style="display:none">
    <img id="diagram" alt="PlantUML diagram" />
  </div>

  <script src="lib/pako.min.js"></script>
  <script src="azure-fetch.js"></script>
  <script src="render-puml.js"></script>
</body>
</html>
