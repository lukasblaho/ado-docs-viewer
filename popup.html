<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure DevOps Docs Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: #0078d4;
      color: white;
    }
    header img { width: 20px; height: 20px; }
    header h1 { font-size: 14px; font-weight: 600; }
    .section { padding: 14px; border-bottom: 1px solid #333; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    label { font-weight: 500; }
    .hint { font-size: 11px; color: #888; margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #555; border-radius: 22px; transition: .2s;
    }
    .slider:before {
      content: ''; position: absolute;
      height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #0078d4; }
    input:checked + .slider:before { transform: translateX(18px); }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 4px;
      color: #d4d4d4;
      font-size: 12px;
      margin-top: 6px;
    }
    input:focus { outline: none; border-color: #0078d4; }

    button {
      margin-top: 8px;
      width: 100%;
      padding: 7px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    button:hover { background: #106ebe; }

    #status {
      font-size: 11px;
      color: #6a9955;
      margin-top: 6px;
      min-height: 14px;
      text-align: center;
    }
    .show-toggle {
      font-size: 11px;
      color: #0078d4;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon16.png" alt="" />
    <h1>Azure DevOps Docs Viewer</h1>
  </header>

  <div class="section">
    <div class="row">
      <label for="toggleEnabled">Auto-render on file open</label>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">Automatically opens a rendered tab for .md, .puml, .yaml/.yml, and .json files.</div>
  </div>

  <div class="section">
    <label>Personal Access Token (PAT)</label>
    <div class="hint">Required for private repositories. Needs <em>Code (read)</em> permission.</div>
    <input type="password" id="patInput" placeholder="Paste your PAT here…" autocomplete="off" />
    <span class="show-toggle" id="showPat">Show</span>
    <button id="saveBtn">Save</button>
    <div id="status"></div>
  </div>
</body>
<script src="popup.js"></script>
</html>
